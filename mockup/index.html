<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Staple — Closet Concept</title>
  <meta name="description" content="Concept prototype: a closet and outfit planner that styles what you own and recommends the Gap pieces that complete it. Not affiliated with Gap Inc." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Shared SVG definitions used by every garment illustration -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g-sheen" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".18" />
        <stop offset=".5" stop-color="#fff" stop-opacity="0" />
        <stop offset="1" stop-color="#000" stop-opacity=".1" />
      </linearGradient>
      <pattern id="p-stripe" width="12" height="12" patternUnits="userSpaceOnUse">
        <rect width="12" height="12" fill="#EFE9DC" />
        <rect y="7" width="12" height="4" fill="#25324B" />
      </pattern>
    </defs>
  </svg>

  <div class="app">
    <aside class="side" id="side"></aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div id="overlay"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="presenter" id="presenter">
    <button class="notes-toggle" data-act="toggle-notes" aria-pressed="false">
      <span class="notes-dot"></span>
      <span>Design notes</span>
      <span class="switch" aria-hidden="true"><span></span></span>
    </button>
  </div>

  <script src="js/garments.js"></script>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
